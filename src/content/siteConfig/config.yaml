# ─────────────────────────────────────────────────────────────────────────────
# Patrika — Site Configuration
# ─────────────────────────────────────────────────────────────────────────────
# This file lives alongside your content in your Obsidian vault.
# Only include the fields you want to override.
# Defaults are defined in src/config/site.config.ts
# ─────────────────────────────────────────────────────────────────────────────

# ── Site identity ─────────────────────────────────────────────────────────────
- id: config
  title: Digifookus
  description: Kõik digitaalsest maailmast, tehnoloogiast, AI-st ja meist selles maailmas. 
  url: https://digifookus.ee 
  locale: et

  # ── Author ────────────────────────────────────────────────────────────────────

  author:
    name: Sergei Ivanov
    bio: Üks Eesti kogenumaid SEO spetsialiste, kellele meeldivad erinevad tehnoloogiad, digitaalsed lahendused ja kiiresti muutuv maailm.
    url: https://hornet.ee
    # avatar: /images/avatar.jpg

  # ── Assets ───────────────────────────────────────────────────────────────────
  # Uncomment to use a logo or custom OG image.
  # Paths are relative to /public

  # Used for schema.org Organization logo (Google prefers a square 1:1 image)
  logo: /digifookus-logo-sq.png
  # ogImage: /images/og-default.jpg

  # ── Navigation ────────────────────────────────────────────────────────────────
  # Top navigation links. Order here is order in the nav bar.

  navigation:
    - title: Artiklid
      url: /artiklid
    - title: Märkmed
      url: /markmed
    - title: Arhiiv
      url: /arhiiv
    - title: Meist
      url: /meist

  # ── Footer links ──────────────────────────────────────────────────────────────

  footerLinks:
    - title: Andmekaitse
      url: /andmekaitse
    - title: RSS
      url: /rss.xml

  # ── Social ────────────────────────────────────────────────────────────────────
  # Supported icons: github, mastodon, twitter, rss, email

  social:
    - title: GitHub
      url: https://github.com/sezhers
      icon: github
    # - title: Mastodon
    #   url: https://mastodon.social/@username  # ← replace or remove
    #   icon: mastodon
    - title: RSS
      url: /rss.xml
      icon: rss

  # ── Content display ───────────────────────────────────────────────────────────

  # Shown as the opening line on the garden homepage
  heroText: Tehnoloogiast, tehisintellektist ja turvalisusest — selgelt ja arusaadavalt.

  # Shown in the footer (optional — remove the line to hide)
  footerCredits: ""

  # Number of posts shown per archive page
  postsPerPage: 8

  # Number of recent entries shown on the homepage
  recentPosts: 4

  # ── Flags ─────────────────────────────────────────────────────────────────────

  # Set to true if you have a logo defined above
  showLogo: false